[package]
name = "media-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rfd = "0.14.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "dump_fixture"
path = "tests/dump_fixture.rs"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
