name: release

on:
  release:
    types: [published]

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fetch
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/release/media-launcher
          asset_name: media-launcher.elf
          asset_content_type: application/x-executable

      - name: Tests
        run: cargo test --all-features

  win32:
    runs-on: windows-2022
    permissions: write-all
    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ${{ env.USERPROFILE }}\\.cargo\\registry
            ${{ env.USERPROFILE }}\\.cargo\\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fetch
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/release/media-launcher.exe
          asset_name: media-launcher.exe
          asset_content_type: application/vnd.microsoft.portable-executable

  macos:
    runs-on: macos-14
    permissions: write-all
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_name: media-launcher-macos-arm64
          - target: x86_64-apple-darwin
            asset_name: media-launcher-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fetch
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/${{ matrix.target }}/release/media-launcher
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/x-executable

      # macos-14 runners are arm64; only the native target can run the test
      # binaries directly, the x86_64 build is cross-compiled without Rosetta.
      - name: Tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --all-features --target ${{ matrix.target }}

  update-homebrew-formula:
    runs-on: ubuntu-24.04
    needs: macos
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Download released binaries and compute checksums
        run: |
          TAG="${{ github.event.release.tag_name }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          curl -sL -o arm64-binary "${BASE_URL}/media-launcher-macos-arm64"
          curl -sL -o x86_64-binary "${BASE_URL}/media-launcher-macos-x86_64"
          echo "ARM_SHA=$(sha256sum arm64-binary | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "INTEL_SHA=$(sha256sum x86_64-binary | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Update formula
        run: |
          ARM_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/media-launcher-macos-arm64"
          INTEL_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/media-launcher-macos-x86_64"
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Formula/media-launcher.rb
          sed -i "/on_arm do/,/end/ { s#url \".*\"#url \"${ARM_URL}\"#; s#sha256 \".*\"#sha256 \"${ARM_SHA}\"#; }" Formula/media-launcher.rb
          sed -i "/on_intel do/,/end/ { s#url \".*\"#url \"${INTEL_URL}\"#; s#sha256 \".*\"#sha256 \"${INTEL_SHA}\"#; }" Formula/media-launcher.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/media-launcher.rb
          git diff --cached --quiet || git commit -m "Update Homebrew formula to ${{ github.event.release.tag_name }}"
          git push origin HEAD:${{ github.event.release.target_commitish }}