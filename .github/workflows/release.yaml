name: release

on:
  release:
    types: [published]

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fetch
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/release/media-launcher
          asset_name: media-launcher.elf
          asset_content_type: application/x-executable

      - name: Tests
        run: cargo test --all-features

  win32:
    runs-on: windows-2022
    permissions: write-all
    steps:
      - uses: actions/checkout@v3

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ${{ env.USERPROFILE }}\\.cargo\\registry
            ${{ env.USERPROFILE }}\\.cargo\\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fetch
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/release/media-launcher.exe
          asset_name: media-launcher.exe
          asset_content_type: application/vnd.microsoft.portable-executable

  macos:
    runs-on: macos-14
    permissions: write-all
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset_name: media-launcher-macos-arm64
          - target: x86_64-apple-darwin
            asset_name: media-launcher-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        id: cache-cargo
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo fetch
        if: steps.cache-cargo.outputs.cache-hit != 'true'
        run: cargo fetch

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/${{ matrix.target }}/release/media-launcher
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/x-executable

      # macos-14 runners are arm64; only the native target can run the test
      # binaries directly, the x86_64 build is cross-compiled without Rosetta.
      - name: Tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --all-features --target ${{ matrix.target }}